<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 590" width="810" height="590" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="How the folders in the logsense repo connect" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#495057" stroke-width="1.6"/></marker></defs><rect width="810" height="590" rx="12" fill="#ffffff"/><text x="97" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#495057">outputs</text><text x="380" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#495057">what runs when someone asks a question</text><text x="690" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#495057">build the database (once)</text><rect x="210" y="40" width="165" height="56" rx="8" fill="#ede7ff" stroke="#7048e8" stroke-width="1.5"/><text x="292.5" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#3b2a8a">run_investigation.py</text><text x="292.5" y="82" text-anchor="middle" font-size="12" fill="#3b2a8a">scripts/ · all 3 roles</text><rect x="385" y="40" width="165" height="56" rx="8" fill="#ede7ff" stroke="#7048e8" stroke-width="1.5"/><text x="467.5" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#3b2a8a">frontend/ + app/</text><text x="467.5" y="82" text-anchor="middle" font-size="12" fill="#3b2a8a">web app: Chat, Insights, Setup</text><rect x="210" y="126" width="340" height="56" rx="8" fill="#e7ecff" stroke="#3b5bdb" stroke-width="1.5"/><text x="380.0" y="149" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">logsense/agent.py</text><text x="380.0" y="168" text-anchor="middle" font-size="12" fill="#1e3a8a">starts claude -p, records each tool call and its SQL</text><rect x="210" y="212" width="340" height="56" rx="8" fill="#ffe8e0" stroke="#e8590c" stroke-width="1.5"/><text x="380.0" y="235" text-anchor="middle" font-size="14" font-weight="600" fill="#8a2c0b">Claude Code (the agent)</text><text x="380.0" y="254" text-anchor="middle" font-size="12" fill="#8a2c0b">reads .mcp.json, picks tools, writes the answer</text><rect x="210" y="298" width="340" height="56" rx="8" fill="#e7ecff" stroke="#3b5bdb" stroke-width="1.5"/><text x="380.0" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">logsense/mcp_server.py + roles.py</text><text x="380.0" y="340" text-anchor="middle" font-size="12" fill="#1e3a8a">the 7 tools and the 3 role prompts</text><rect x="210" y="384" width="340" height="56" rx="8" fill="#e7ecff" stroke="#3b5bdb" stroke-width="1.5"/><text x="380.0" y="407" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">logsense/tools.py</text><text x="380.0" y="426" text-anchor="middle" font-size="12" fill="#1e3a8a">7 fixed SQL templates: rows + totals + the SQL</text><rect x="210" y="470" width="340" height="56" rx="8" fill="#dcf5ee" stroke="#0ca678" stroke-width="1.5"/><text x="380.0" y="493" text-anchor="middle" font-size="14" font-weight="600" fill="#0b5d47">SereneDB in Docker</text><text x="380.0" y="512" text-anchor="middle" font-size="12" fill="#0b5d47">docker-compose.yml · log tables + search indexes</text><rect x="20" y="126" width="155" height="56" rx="8" fill="#f0f2f5" stroke="#868e96" stroke-width="1.5"/><text x="97.5" y="149" text-anchor="middle" font-size="14" font-weight="600" fill="#343a40">investigation/</text><text x="97.5" y="168" text-anchor="middle" font-size="12" fill="#343a40">saved answers + SQL</text><rect x="20" y="212" width="155" height="56" rx="8" fill="#ede7ff" stroke="#7048e8" stroke-width="1.5"/><text x="97.5" y="235" text-anchor="middle" font-size="14" font-weight="600" fill="#3b2a8a">claude</text><text x="97.5" y="254" text-anchor="middle" font-size="12" fill="#3b2a8a">you, in a terminal</text><rect x="20" y="470" width="155" height="56" rx="8" fill="#f0f2f5" stroke="#868e96" stroke-width="1.5"/><text x="97.5" y="493" text-anchor="middle" font-size="14" font-weight="600" fill="#343a40">docs/ + README</text><text x="97.5" y="512" text-anchor="middle" font-size="12" fill="#343a40">how it all works</text><rect x="590" y="40" width="200" height="56" rx="8" fill="#fff3d6" stroke="#c07000" stroke-width="1.5"/><text x="690.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#6b3a00">scripts/setup_db.py</text><text x="690.0" y="82" text-anchor="middle" font-size="12" fill="#6b3a00">one command for all below</text><rect x="590" y="126" width="200" height="56" rx="8" fill="#fff3d6" stroke="#c07000" stroke-width="1.5"/><text x="690.0" y="149" text-anchor="middle" font-size="14" font-weight="600" fill="#6b3a00">data/ raw logs</text><text x="690.0" y="168" text-anchor="middle" font-size="12" fill="#6b3a00">BGL.log, openstack_*.log</text><rect x="590" y="212" width="200" height="56" rx="8" fill="#fff3d6" stroke="#c07000" stroke-width="1.5"/><text x="690.0" y="235" text-anchor="middle" font-size="14" font-weight="600" fill="#6b3a00">scripts/logs_to_csv.py</text><text x="690.0" y="254" text-anchor="middle" font-size="12" fill="#6b3a00">one row per log line</text><rect x="590" y="298" width="200" height="56" rx="8" fill="#fff3d6" stroke="#c07000" stroke-width="1.5"/><text x="690.0" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#6b3a00">data/*.csv</text><text x="690.0" y="340" text-anchor="middle" font-size="12" fill="#6b3a00">openstack.csv, bgl.csv</text><rect x="590" y="384" width="200" height="56" rx="8" fill="#fff3d6" stroke="#c07000" stroke-width="1.5"/><text x="690.0" y="407" text-anchor="middle" font-size="14" font-weight="600" fill="#6b3a00">sql/01 to 05</text><text x="690.0" y="426" text-anchor="middle" font-size="12" fill="#6b3a00">tables, teams, indexes</text><path d="M292 96L292 124" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><path d="M467 96L467 124" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><text x="475" y="115" text-anchor="start" font-size="12" fill="#495057">Chat</text><path d="M380 182L380 210" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><text x="388" y="201" text-anchor="start" font-size="12" fill="#495057">claude -p</text><path d="M380 268L380 296" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><text x="388" y="287" text-anchor="start" font-size="12" fill="#495057">MCP</text><path d="M380 354L380 382" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><path d="M380 440L380 468" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><text x="388" y="459" text-anchor="start" font-size="12" fill="#495057">SQL</text><path d="M210 154L177 154" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="192" y="146" text-anchor="middle" font-size="12" fill="#495057">saves</text><path d="M175 240L208 240" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><path d="M550 60L588 60" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><text x="569" y="54" text-anchor="middle" font-size="12" fill="#495057">Setup</text><path d="M550 84L568 84L568 412L552 412" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><text x="563" y="250" text-anchor="middle" font-size="12" fill="#495057" transform="rotate(-90 563 250)">Insights (no AI)</text><path d="M690 96L690 124" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><path d="M690 182L690 210" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><path d="M690 268L690 296" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><path d="M690 354L690 382" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><path d="M690 440L690 498L552 498" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ah)"/><text x="620" y="490" text-anchor="middle" font-size="12" fill="#495057">loads</text><rect x="20" y="558" width="14" height="14" rx="3" fill="#ede7ff" stroke="#7048e8" stroke-width="1.5"/><text x="40" y="570" text-anchor="start" font-size="12" fill="#495057">you run it</text><rect x="138" y="558" width="14" height="14" rx="3" fill="#e7ecff" stroke="#3b5bdb" stroke-width="1.5"/><text x="158" y="570" text-anchor="start" font-size="12" fill="#495057">logsense/ package</text><rect x="305" y="558" width="14" height="14" rx="3" fill="#ffe8e0" stroke="#e8590c" stroke-width="1.5"/><text x="325" y="570" text-anchor="start" font-size="12" fill="#495057">Claude Code</text><rect x="430" y="558" width="14" height="14" rx="3" fill="#dcf5ee" stroke="#0ca678" stroke-width="1.5"/><text x="450" y="570" text-anchor="start" font-size="12" fill="#495057">database</text><rect x="534" y="558" width="14" height="14" rx="3" fill="#fff3d6" stroke="#c07000" stroke-width="1.5"/><text x="554" y="570" text-anchor="start" font-size="12" fill="#495057">build once</text><rect x="652" y="558" width="14" height="14" rx="3" fill="#f0f2f5" stroke="#868e96" stroke-width="1.5"/><text x="672" y="570" text-anchor="start" font-size="12" fill="#495057">outputs and docs</text></svg>
